      'motion-zip-hoodie': { id: 'motion-zip-hoodie', name: 'Motion Zip Hoodie', gender: 'Unisex', category: 'Unisex', price: 5200, badge: '', description: 'A brushed-fleece zip layer for warm-ups and rest days.', colours: [{ name: 'Jet Black', hex: ['#18181b'], images: ['https://placehold.co/900x1200/E8E6E1/666666?text=PLACEHOLDER+IMAGE+10'] }], sizes: ['S', 'M', 'L', 'XL', 'XXL'].map(name => ({ name, inStock: true })), fabric: 'Brushed cotton blend fleece', care: 'Machine wash cold', shipping: 'Free delivery over LKR 7,500, 2-3 days island-wide' },
      'everyday-cotton-cap': { id: 'everyday-cotton-cap', name: 'Everyday Cotton Cap', gender: 'Unisex', category: 'Unisex', price: 3500, badge: '', description: 'A cotton twill cap with an adjustable back strap.', colours: [{ name: 'Washed Navy', hex: ['#1e3a8a'], images: ['https://placehold.co/900x1200/E8E6E1/666666?text=PLACEHOLDER+IMAGE+11'] }], sizes: [{ name: 'One Size', inStock: true }], fabric: 'Cotton twill', care: 'Spot clean', shipping: 'Free delivery over LKR 7,500, 2-3 days island-wide' },
      'studio-training-tank': { id: 'studio-training-tank', name: 'Studio Training Tank', gender: 'Unisex', category: 'Unisex', price: 3750, badge: '', description: 'A breathable training tank with a clean, relaxed silhouette.', colours: [{ name: 'Cloud White', hex: ['#ffffff'], images: ['https://placehold.co/900x1200/E8E6E1/666666?text=PLACEHOLDER+IMAGE+12'] }], sizes: ['XS', 'S', 'M', 'L', 'XL'].map(name => ({ name, inStock: true })), fabric: 'Breathable performance fabric', care: 'Machine wash cold', shipping: 'Free delivery over LKR 7,500, 2-3 days island-wide' },
      'warmup-crewneck': { id: 'warmup-crewneck', name: 'Warmup Crewneck Sweatshirt', gender: 'Unisex', category: 'Unisex', price: 5300, badge: '', description: 'A soft brushed crewneck made for cool mornings and easy layering.', colours: [{ name: 'Heather Grey', hex: ['#9ca3af'], images: ['https://placehold.co/900x1200/E8E6E1/666666?text=PLACEHOLDER+IMAGE+13'] }], sizes: ['S', 'M', 'L', 'XL', 'XXL'].map(name => ({ name, inStock: true })), fabric: 'Brushed cotton blend', care: 'Machine wash cold', shipping: 'Free delivery over LKR 7,500, 2-3 days island-wide' },
      'gym-duffel-bag': { id: 'gym-duffel-bag', name: 'Everyday Gym Duffel', gender: 'Unisex', category: 'Accessories', price: 5000, badge: '', description: 'A compact carryall with space for training essentials.', colours: [{ name: 'Black', hex: ['#18181b'], images: ['https://placehold.co/900x1200/E8E6E1/666666?text=PLACEHOLDER+IMAGE+14'] }], sizes: [{ name: 'One Size', inStock: true }], fabric: 'Durable woven fabric', care: 'Wipe clean with a damp cloth', shipping: 'Free delivery over LKR 7,500, 2-3 days island-wide' }
    };
    const money = amount => `LKR ${Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const productId = new URLSearchParams(window.location.search).get('id');
    const product = products[productId];
    const $ = selector => document.querySelector(selector);
    const mainImage = $('#main-image');
    const thumbnails = $('#thumbnails');
    let colourIndex = 0, imageIndex = 0, selectedSize = '', quantity = 1, addedTimer, touchStartX = 0;
    window.addEventListener('load', () => {
      if (window.tailwind) tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] } } } };
    }, { once: true });
    function initialiseTheme() {
      const saved = localStorage.getItem('forma-product-theme');
      const useDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', useDark);
      updateThemeButton();
    }
    function updateThemeButton() {
      const dark = document.documentElement.classList.contains('dark');
      $('#moon-icon').classList.toggle('hidden', dark); $('#sun-icon').classList.toggle('hidden', !dark);
      $('#theme-toggle').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    function imageList() { return product.colours[colourIndex].images; }
    function updateGallery(animate = true) {
      const images = imageList(); imageIndex = (imageIndex + images.length) % images.length;
      mainImage.src = images[imageIndex]; mainImage.alt = `${product.name} - ${product.colours[colourIndex].name}, image ${imageIndex + 1}`;
      if (animate) { mainImage.classList.remove('image-fade'); void mainImage.offsetWidth; mainImage.classList.add('image-fade'); }
      $('#image-counter').textContent = `${String(imageIndex + 1).padStart(2, '0')} / ${String(images.length).padStart(2, '0')}`;
      thumbnails.replaceChildren();
      images.forEach((src, index) => {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'thumb';
        button.setAttribute('aria-label', `Show image ${index + 1} of ${images.length}`); button.setAttribute('aria-pressed', String(index === imageIndex));
        const image = document.createElement('img'); image.src = src; image.alt = `${product.name} thumbnail ${index + 1}`; image.className = 'h-full w-full object-cover';
        button.append(image); button.addEventListener('click', () => { imageIndex = index; updateGallery(); }); thumbnails.append(button);
      });
    }
    function updatePrice() {
      const label = `Add to Cart — ${money(product.price * quantity)}`;
      $('#add-to-cart').textContent = label; $('#mobile-add-to-cart').textContent = label;
      $('#quantity-value').textContent = quantity; $('#quantity-minus').disabled = quantity <= 1; $('#quantity-plus').disabled = quantity >= 10;
    }
    function renderSwatches() {
      const host = $('#swatches'); host.replaceChildren();
      product.colours.forEach((colour, index) => {
        const button = document.createElement('button'); button.type = 'button';
        button.className = 'grid h-7 w-7 place-items-center rounded-full border border-black/10 p-[2px] dark:border-white/25';
        button.setAttribute('aria-label', `Select ${colour.name}`); button.setAttribute('aria-pressed', String(index === colourIndex)); button.title = colour.name;
        const fill = document.createElement('span'); fill.className = 'h-full w-full rounded-full';
        fill.style.background = colour.hex.length > 1 ? `linear-gradient(135deg, ${colour.hex[0]} 50%, ${colour.hex[1]} 50%)` : colour.hex[0]; button.append(fill);
        button.addEventListener('click', () => {
          colourIndex = index; imageIndex = 0; $('#color-label').textContent = colour.name;
          host.querySelectorAll('button').forEach((swatch, swatchIndex) => {
            const active = swatchIndex === index; swatch.classList.toggle('ring-2', active); swatch.classList.toggle('ring-black', active); swatch.classList.toggle('ring-offset-2', active); swatch.setAttribute('aria-pressed', String(active));
          }); updateGallery();
        });
        if (index === colourIndex) button.classList.add('ring-2', 'ring-black', 'ring-offset-2'); host.append(button);
      }); $('#color-label').textContent = product.colours[colourIndex].name;
    }
    function renderSizes() {
      const host = $('#size-row'); host.replaceChildren();
      product.sizes.forEach(size => {
        const button = document.createElement('button'); button.type = 'button'; button.textContent = size.name; button.disabled = !size.inStock;
        button.className = 'size-option min-w-[37px] rounded-[8px] border border-black/[.1] px-2.5 py-2 text-[10px] transition hover:border-black dark:border-white/15 dark:hover:border-white';
        button.setAttribute('aria-label', `${size.name}${size.inStock ? '' : ', out of stock'}`); button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          selectedSize = size.name; $('#size-error').classList.add('hidden'); host.classList.remove('shake');
          host.querySelectorAll('button').forEach(option => {
            const active = option === button; option.setAttribute('aria-pressed', String(active)); option.classList.toggle('bg-black', active); option.classList.toggle('text-white', active); option.classList.toggle('border-black', active);
          });
        }); host.append(button);
      });
    }
    function updateCartCount() {
      let lines = []; try { lines = JSON.parse(sessionStorage.getItem('cart') || '[]'); } catch { lines = []; }
      const count = Array.isArray(lines) ? lines.reduce((total, line) => total + (Number(line.quantity) || 0), 0) : 0;
      $('#cart-count').textContent = count; $('#cart-count').setAttribute('aria-label', `${count} items in cart`);
    }
    function addToCart() {
      if (!selectedSize) {
        $('#size-row').classList.remove('shake'); void $('#size-row').offsetWidth; $('#size-row').classList.add('shake');
        $('#size-error').classList.remove('hidden'); $('#cart-message').textContent = 'Please select a size'; return;
      }
      const line = { id: product.id, name: product.name, colour: product.colours[colourIndex].name, size: selectedSize, quantity, price: product.price, image: imageList()[imageIndex] };
      let lines = []; try { lines = JSON.parse(sessionStorage.getItem('cart') || '[]'); } catch { lines = []; }
      if (!Array.isArray(lines)) lines = []; lines.push(line);
      try { sessionStorage.setItem('cart', JSON.stringify(lines)); } catch { $('#cart-message').textContent = 'Unable to save your cart in this browser session'; return; }
      updateCartCount(); clearTimeout(addedTimer); $('#add-to-cart').textContent = 'Added to Cart ✓'; $('#mobile-add-to-cart').textContent = 'Added to Cart ✓'; $('#cart-message').textContent = 'Added to your cart';
      addedTimer = setTimeout(() => { updatePrice(); $('#cart-message').textContent = ''; }, 1500);
    }
    function openSizeModal() { const modal = $('#size-modal'); modal.classList.remove('hidden'); modal.classList.add('flex'); document.documentElement.classList.add('modal-open'); $('#size-guide-close').focus(); }
    function closeSizeModal() { $('#size-modal').classList.add('hidden'); $('#size-modal').classList.remove('flex'); document.documentElement.classList.remove('modal-open'); $('#size-guide-open').focus(); }
    function renderProduct() {
      if (!product) {
        $('#product-layout').innerHTML = '<section class="glass-panel col-span-full mx-auto w-full max-w-lg rounded-[20px] px-7 py-12 text-center"><p class="text-[9px] font-bold uppercase tracking-[.2em] text-neutral-500">FORMA</p><h1 class="mt-3 text-2xl font-bold">Product not found</h1><p class="mt-2 text-sm text-neutral-500 dark:text-neutral-400">This piece may have moved or is no longer available.</p><a href="/catalog.html" class="mt-6 inline-flex rounded-[10px] bg-black px-5 py-3 text-xs font-bold text-white dark:bg-white dark:text-black">Back to shop</a></section>';
        $('#breadcrumb').innerHTML = '<a class="shrink-0 hover:text-black dark:hover:text-white" href="/catalog.html">Shop</a><span>/</span><span>Product not found</span>';
        document.title = 'Product not found | FORMA'; document.querySelector('meta[name="description"]').content = 'This FORMA product could not be found.'; return;
      }
      document.title = `${product.name} | FORMA`; document.querySelector('meta[name="description"]').content = product.description;
      const categoryUrl = `/catalog.html?gender=${encodeURIComponent(product.gender)}`;
      $('#breadcrumb').innerHTML = `<a class="shrink-0 hover:text-black dark:hover:text-white" href="/catalog.html">Shop</a><span>/</span><a class="shrink-0 hover:text-black dark:hover:text-white" href="${categoryUrl}">${product.category}</a><span>/</span><span class="truncate font-semibold text-neutral-800 dark:text-neutral-200">${product.name}</span>`;
      $('#product-gender').textContent = product.gender.toUpperCase(); $('#product-name').textContent = product.name; $('#product-price').textContent = money(product.price); $('#product-description').textContent = product.description;
      $('#badge').textContent = product.badge; $('#badge').classList.toggle('hidden', !product.badge);
      $('#product-specs').innerHTML = [['Fabric', product.fabric], ['Care', product.care], ['Shipping', product.shipping]].map(([label, value]) => `<div class="flex items-start justify-between gap-4 py-2.5"><dt class="shrink-0 text-neutral-500 dark:text-neutral-400">${label}</dt><dd class="m-0 max-w-[72%] text-right font-medium">${value}</dd></div>`).join('');
      $('#size-chart').innerHTML = [['XS', 78, 43], ['S', 82, 44], ['M', 88, 45], ['L', 94, 46], ['XL', 100, 47], ['XXL', 106, 48]].map(([size, chest, length]) => `<tr class="border-b border-black/[.06] last:border-0 dark:border-white/[.08]"><td class="py-2.5">${size}</td><td class="py-2.5">${chest}</td><td class="py-2.5">${length}</td></tr>`).join('');
      renderSwatches(); renderSizes(); updateGallery(false); updatePrice();
      const observer = new IntersectionObserver(([entry]) => $('#mobile-cart-bar').classList.toggle('hidden', entry.isIntersecting), { threshold: 0 }); observer.observe($('#add-to-cart'));
    }
    initialiseTheme(); renderProduct(); updateCartCount();
    $('#theme-toggle').addEventListener('click', () => { const dark = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', dark); localStorage.setItem('forma-product-theme', dark ? 'dark' : 'light'); updateThemeButton(); });
    if (product) {
      $('#quantity-minus').addEventListener('click', () => { quantity = Math.max(1, quantity - 1); updatePrice(); });
      $('#quantity-plus').addEventListener('click', () => { quantity = Math.min(10, quantity + 1); updatePrice(); });
      $('#add-to-cart').addEventListener('click', addToCart); $('#mobile-add-to-cart').addEventListener('click', addToCart);
      $('#size-guide-open').addEventListener('click', openSizeModal); $('#size-guide-close').addEventListener('click', closeSizeModal);
      $('#size-modal').addEventListener('click', event => { if (event.target === $('#size-modal')) closeSizeModal(); });
    }
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !$('#size-modal').classList.contains('hidden')) closeSizeModal();
      if (!product || event.altKey || event.ctrlKey || event.metaKey || !$('#size-modal').classList.contains('hidden')) return;
      if (event.key === 'ArrowLeft') { imageIndex--; updateGallery(); } if (event.key === 'ArrowRight') { imageIndex++; updateGallery(); }
    });
    if (product) {
      $('#gallery').addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
      $('#gallery').addEventListener('touchend', event => { const delta = event.changedTouches[0].clientX - touchStartX; if (Math.abs(delta) > 40) { imageIndex += delta < 0 ? 1 : -1; updateGallery(); } }, { passive: true });
    }
    window.addEventListener('storage', event => { if (event.key === 'cart') updateCartCount(); });
  </script>
